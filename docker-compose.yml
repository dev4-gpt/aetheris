name: aetheris-pilot
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AETHERIS_ADMIN_PASSWORD: ${AETHERIS_ADMIN_PASSWORD:?Set AETHERIS_ADMIN_PASSWORD in .env}
      AETHERIS_DB_PATH: /data/aetheris.db
    volumes:
      - aetheris_data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      AETHERIS_DOMAIN: ${AETHERIS_DOMAIN:?Set AETHERIS_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
volumes:
  aetheris_data:
  caddy_data:
  caddy_config:
